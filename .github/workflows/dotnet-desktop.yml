name: yt-dlp GUI CI Builder (Debug)

on:
  push:
    branches: [ "master" ] # Or your main development branch

jobs:
  build-debug: # Renamed job for clarity
    strategy:
      matrix:
        configuration: [Debug] # This workflow is specifically for Debug configuration

    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Updated to v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4 # Updated to v4
      with:
        dotnet-version: '6.0.x' # Consistent with release.yml

    - name: Restore dependencies
      run: dotnet restore yt-dlp-gui/yt-dlp-gui.csproj # Target project file

    - name: Build application
      run: dotnet build yt-dlp-gui/yt-dlp-gui.csproj --configuration ${{ matrix.configuration }} --no-restore
    
    - name: Publish application (Debug)
      run: dotnet publish yt-dlp-gui/yt-dlp-gui.csproj --configuration ${{ matrix.configuration }} --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish_output_debug
      # Added IncludeNativeLibrariesForSelfExtract for consistency if needed, can be removed if debug builds don't require it strictly
      # Output to a specific relative folder ./publish_output_debug

    - name: Upload Debug Build Artifact
      uses: actions/upload-artifact@v4 # Updated to v4
      with:
        name: yt-dlp-gui-debug-${{ github.sha }} # Artifact name includes 'debug'
        path: ./publish_output_debug/ # Use relative path from publish step
        retention-days: 7 # Optional: Keep debug artifacts for a week

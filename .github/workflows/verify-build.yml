name: Verify WPF Build Environment

on:
  workflow_dispatch: # Allows us to run this manually

jobs:
  verify:
    name: Create and Build Minimal WPF App
    runs-on: windows-latest

    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Create Minimal WPF Project
        run: dotnet new wpf -o TestWpfApp -n TestWpfApp

      - name: Build the Test Project
        run: dotnet build TestWpfApp/TestWpfApp.csproj --configuration Release

      - name: Conclude
        run: echo "SUCCESS: The Windows WPF build environment is working correctly."
